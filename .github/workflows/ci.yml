name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend linting and testing
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements/dev.txt

      - name: Lint with Ruff
        run: |
          cd backend && ruff check .

      - name: Type check with MyPy
        run: |
          cd backend && mypy app/

      - name: Run unit tests
        run: |
          cd backend && pytest tests/unit -v --cov=app --cov-fail-under=80 --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  # Frontend linting and testing
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install dependencies
        run: |
          cd FRONTEND && npm ci

      - name: Lint
        run: |
          cd FRONTEND && npm run lint

      - name: Type check
        run: |
          cd FRONTEND && npx tsc --noEmit

      - name: Run tests
        run: |
          cd FRONTEND && npm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./FRONTEND/coverage/lcov.info
          flags: frontend

  # Build and push Docker images
  build-images:
    name: Build & Push Images
    needs: [backend-lint-test, frontend-lint-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: false

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FRONTEND
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Extract metadata (worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: builder  # Use builder stage for worker (no CUDA base)

  # Deploy to staging (develop branch)
  deploy-staging:
    name: Deploy to Staging
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS staging services
        run: |
          # Update backend service
          aws ecs update-service \
            --cluster gym-trainer-staging \
            --service backend \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

          # Update frontend service
          aws ecs update-service \
            --cluster gym-trainer-staging \
            --service frontend \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

          # Update worker service
          aws ecs update-service \
            --cluster gym-trainer-staging \
            --service worker \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster gym-trainer-staging \
            --services backend frontend worker \
            --region ${{ secrets.AWS_REGION }}

      - name: Run smoke tests
        run: |
          # Wait a bit for services to be ready
          sleep 30
          # Test health endpoint
          curl -f https://staging-api.yourdomain.com/api/v1/health || exit 1
          curl -f https://staging.yourdomain.com/health || exit 1

  # Deploy to production (main branch)
  deploy-production:
    name: Deploy to Production
    needs: build-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy with blue-green strategy
        run: |
          # Update backend service with rolling update
          aws ecs update-service \
            --cluster gym-trainer-prod \
            --service backend \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
            --region ${{ secrets.AWS_REGION }}

          # Update frontend service
          aws ecs update-service \
            --cluster gym-trainer-prod \
            --service frontend \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
            --region ${{ secrets.AWS_REGION }}

          # Update worker service
          aws ecs update-service \
            --cluster gym-trainer-prod \
            --service worker \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster gym-trainer-prod \
            --services backend frontend worker \
            --region ${{ secrets.AWS_REGION }}

      - name: Run production smoke tests
        run: |
          sleep 30
          curl -f https://api.yourdomain.com/api/v1/health || exit 1
          curl -f https://yourdomain.com/health || exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          # Could add Slack/Discord notification here

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          # Could add Slack/Discord notification here