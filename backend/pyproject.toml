[project]
name = "gym-trainer-backend"
version = "0.1.0"
description = "CV-Based AI Gym Trainer - FastAPI Backend with ONNX Runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",

    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pgvector==0.5.0",

    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose==3.3.0",

    # ML/Inference
    "onnxruntime-gpu==1.18.1",
    "onnx==1.17.0",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "lightgbm==4.3.0",
    "skl2onnx==1.16.0",

    # Video Processing
    "opencv-python-headless==4.9.0.80",
    "ffmpeg-python==0.2.0",

    # Storage
    "boto3==1.34.109",
    "minio==7.2.7",

    # Task Queue
    "celery==5.4.0",
    "redis==5.0.1",

    # Observability
    "structlog==24.1.0",
    "prometheus-client==0.19.0",
    "prometheus-fastapi-instrumentator==7.0.1",

    # Validation
    "email-validator==2.1.0.post1",

    # HTTP Client
    "httpx==0.27.0",

    # Utilities
    "python-dotenv==1.0.1",
    "tqdm==4.66.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "ipython==8.25.0",
]
ml = [
    "mediapipe==0.10.14",
    "tf2onnx==1.16.1",
    "tensorflow==2.16.1",
    "torch==2.3.0",
]
prod = [
    "gunicorn==22.0.0",
    "sentry-sdk==1.52.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
exclude = ["migrations", ".venv", "dist", "build"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"